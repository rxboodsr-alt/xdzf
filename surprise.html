<!DOCTYPE html>
<html>
<head>

<style>
body{
    margin:0;
    background:#ffdbe8;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

img{
    max-width:90%;
    border-radius:25px;

    animation:show 2s;
}

@keyframes show{

from{
    opacity:0;
    transform:scale(.5);
}

to{
    opacity:1;
    transform:scale(1);
}

}
</style>

</head>

<body>

<img src="surprise.png">

</body>
</html>
